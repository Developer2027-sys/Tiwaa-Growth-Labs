[package]
name = "tgl-site"
description = "Renders the Tiwaa Growth Labs site (templates/ + content/) to public/, plus a local dev server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "tgl"
path = "src/main.rs"

[dependencies]
tgl-leads = { path = "../leads" }
minijinja = { version = "2", features = ["loader", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.9"
regex = "1"
tiny_http = "0.12"
