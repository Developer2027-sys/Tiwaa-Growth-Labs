# Site-wide settings. Change contact details here and they update everywhere
# (header, footer, popup, contact form, structured data, JS messages).
# After editing, rebuild:  npm run build   (or just deploy: npm run deploy)

name          = "Tiwaa Growth Labs"
legal_name    = "Tiwaa Growth Lab Private Limited"

# Public site address, used for Open Graph, structured data and the sitemap.
site_url      = "https://www.tiwaagrowthlab.com"

# Canonical tag base. Left empty for now, so pages output <link rel="canonical" href="">.
# When the domain is live, set it (e.g. "https://www.tiwaagrowthlab.com") and rebuild.
canonical_url = ""

phone_display = "+91 90501 26213"
phone_intl    = "919050126213"     # digits only, used for tel: and WhatsApp links
email         = "info@tiwaagrowthlab.com"

# Lead API endpoint (the Rust Worker in worker/, backed by D1).
api_path      = "/api/leads"

# Active colour palette from the design (see assets/css/main.css, :root[data-pal="..."]).
palette       = "ocean2"

[address]
street   = "Tower B1, Spaze I Tech Park, 32B & 33A, Badshahpur Sohna Road, Sector 49"
city     = "Gurugram"
region   = "Haryana"
postcode = "122018"
country  = "IN"

# Social profiles (full URLs). Empty ones are hidden in the footer and left out of structured data.
[social]
facebook  = ""
linkedin  = ""
instagram = ""
youtube   = ""

# Tracking IDs. Leave empty to load nothing. If you use Google Tag Manager,
# set only gtm_id and add GA4 / Meta Pixel inside GTM instead.
[analytics]
gtm_id        = ""   # e.g. "GTM-XXXXXXX"
ga4_id        = ""   # e.g. "G-XXXXXXXXXX"
meta_pixel_id = ""   # digits only
