<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>How to cut cost per site visit with Meta lead forms</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A84FF"/><stop offset=".6" stop-color="#3D5BF0"/><stop offset="1" stop-color="#5856D6"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB86B"/><stop offset=".55" stop-color="#FF7A8A"/><stop offset="1" stop-color="#5B4BD8"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A84FF"/><stop offset="1" stop-color="#5856D6"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#fff" opacity=".12"/></pattern>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0B1240" flood-opacity=".38"/></filter>
    <filter id="sh2" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0B1240" flood-opacity=".3"/></filter>
    <clipPath id="scr"><rect x="626" y="126" width="348" height="648" rx="38"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <circle cx="1380" cy="140" r="260" fill="#fff" opacity=".08"/>
  <circle cx="180" cy="820" r="320" fill="#fff" opacity=".07"/>
  <circle cx="800" cy="450" r="380" fill="#fff" opacity=".06"/>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="610" y="110" width="380" height="680" rx="54" fill="#0B1220"/>
  </g>
  <g clip-path="url(#scr)">
    <rect x="626" y="126" width="348" height="648" fill="#fff"/>
    <!-- ad header -->
    <circle cx="668" cy="196" r="20" fill="url(#btn)"/>
    <text x="668" y="203" font-size="19" font-weight="700" fill="#fff" text-anchor="middle">S</text>
    <text x="700" y="191" font-size="17" font-weight="700" fill="#0B1220">Sector 65 Residences</text>
    <text x="700" y="213" font-size="13" fill="#6B7489">Sponsored · Instant form</text>
    <!-- ad image -->
    <rect x="626" y="236" width="348" height="190" fill="url(#sky)"/>
    <circle cx="910" cy="290" r="26" fill="#FFE7B8" opacity=".9"/>
    <rect x="650" y="330" width="44" height="96" rx="4" fill="#fff" opacity=".35"/>
    <rect x="702" y="282" width="62" height="144" rx="4" fill="#fff" opacity=".6"/>
    <rect x="772" y="312" width="48" height="114" rx="4" fill="#fff" opacity=".45"/>
    <rect x="828" y="262" width="70" height="164" rx="4" fill="#fff" opacity=".7"/>
    <rect x="906" y="320" width="52" height="106" rx="4" fill="#fff" opacity=".42"/>
    <g fill="#5B4BD8" opacity=".35">
      <rect x="714" y="298" width="10" height="8" rx="1.5"/><rect x="742" y="298" width="10" height="8" rx="1.5"/>
      <rect x="714" y="318" width="10" height="8" rx="1.5"/><rect x="742" y="318" width="10" height="8" rx="1.5"/>
      <rect x="714" y="338" width="10" height="8" rx="1.5"/><rect x="742" y="338" width="10" height="8" rx="1.5"/>
      <rect x="842" y="280" width="12" height="9" rx="1.5"/><rect x="872" y="280" width="12" height="9" rx="1.5"/>
      <rect x="842" y="302" width="12" height="9" rx="1.5"/><rect x="872" y="302" width="12" height="9" rx="1.5"/>
      <rect x="842" y="324" width="12" height="9" rx="1.5"/><rect x="872" y="324" width="12" height="9" rx="1.5"/>
    </g>
    <!-- form -->
    <text x="648" y="466" font-size="19" font-weight="700" fill="#0B1220">Get the price sheet</text>
    <rect x="648" y="484" width="304" height="58" rx="14" fill="#F2F4F8"/>
    <text x="666" y="519" font-size="15" fill="#475069">Your budget?</text>
    <text x="934" y="519" font-size="15" font-weight="700" fill="#0A84FF" text-anchor="end">₹1.5–2 Cr</text>
    <rect x="648" y="552" width="304" height="58" rx="14" fill="#F2F4F8"/>
    <text x="666" y="587" font-size="15" fill="#475069">Configuration?</text>
    <text x="934" y="587" font-size="15" font-weight="700" fill="#0A84FF" text-anchor="end">3 BHK</text>
    <rect x="648" y="620" width="304" height="58" rx="14" fill="#F2F4F8"/>
    <text x="666" y="655" font-size="15" fill="#475069">Planning to buy in?</text>
    <text x="934" y="655" font-size="15" font-weight="700" fill="#0A84FF" text-anchor="end">0–3 months</text>
    <rect x="648" y="694" width="304" height="54" rx="14" fill="url(#btn)"/>
    <text x="800" y="727" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Submit</text>
  </g>
  <rect x="740" y="140" width="120" height="26" rx="13" fill="#0B1220"/>

  <!-- cost per site visit card -->
  <g filter="url(#sh2)">
    <rect x="250" y="250" width="300" height="168" rx="28" fill="#fff"/>
  </g>
  <text x="282" y="298" font-size="18" font-weight="600" fill="#6B7489">Cost per site visit</text>
  <text x="282" y="346" font-size="24" font-weight="600" fill="#9AA2B5" text-decoration="line-through">₹9,000</text>
  <text x="282" y="392" font-size="44" font-weight="800" fill="#0B1220" letter-spacing="-1">₹4,700</text>
  <rect x="448" y="366" width="76" height="32" rx="16" fill="#E7F8EC"/>
  <text x="486" y="388" font-size="16" font-weight="700" fill="#1E9E52" text-anchor="middle">−48%</text>

  <!-- qualified leads card -->
  <g filter="url(#sh2)">
    <rect x="1050" y="486" width="300" height="160" rx="28" fill="#fff"/>
  </g>
  <circle cx="1098" cy="536" r="22" fill="#E7F8EC"/>
  <path d="M1087 536l8 8 15-16" fill="none" stroke="#1E9E52" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1134" y="531" font-size="18" font-weight="700" fill="#0B1220">Site visit booked</text>
  <text x="1134" y="555" font-size="15" fill="#6B7489">Sat · 11:00 AM</text>
  <rect x="1076" y="582" width="248" height="10" rx="5" fill="#EEF1F6"/>
  <rect x="1076" y="582" width="186" height="10" rx="5" fill="url(#btn)"/>
  <text x="1076" y="622" font-size="15" fill="#6B7489">Qualified leads</text>
  <text x="1324" y="622" font-size="15" font-weight="700" fill="#0B1220" text-anchor="end">3 of 4</text>

  <!-- connector -->
  <path d="M550 334 C 590 334, 590 360, 612 360" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"/>
  <path d="M990 560 C 1020 560, 1020 566, 1050 566" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"/>
</svg>
