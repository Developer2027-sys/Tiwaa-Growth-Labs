{%- from "sections/about/_faqs.html" import faqs -%}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "AboutPage",
            "@id": "{{ abs_url('/about#webpage') }}",
            "url": "{{ abs_url('/about') }}",
            "name": "About Tiwaa Growth Labs | Real Estate Marketing Company",
            "description": "Tiwaa Growth Labs is a real estate marketing company in Gurugram (Gurgaon). Meet the team behind 300+ project launches, LeadsPulse CRM and how we work.",
            "inLanguage": "en-IN",
            "isPartOf": { "@type": "WebSite", "name": "{{ site.name }}", "url": "{{ abs_url('/') }}" },
            "about": { "@id": "{{ abs_url('/#organization') }}" },
            "mainEntity": { "@id": "{{ abs_url('/#organization') }}" },
            "primaryImageOfPage": "{{ abs_url('/assets/images/og-image.png') }}",
            "breadcrumb": { "@id": "{{ abs_url('/about#breadcrumb') }}" }
        },
        {
            "@type": "BreadcrumbList",
            "@id": "{{ abs_url('/about#breadcrumb') }}",
            "itemListElement": [
                { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ abs_url('/') }}" },
                { "@type": "ListItem", "position": 2, "name": "About us", "item": "{{ abs_url('/about') }}" }
            ]
        },
        {
            "@type": "FAQPage",
            "mainEntity": [
{% for f in faqs %}
                { "@type": "Question", "name": {{ f[0] | tojson }}, "acceptedAnswer": { "@type": "Answer", "text": {{ f[1] | tojson }} } }{% if not loop.last %},{% endif %}

{% endfor %}
            ]
        }
    ]
}
</script>
