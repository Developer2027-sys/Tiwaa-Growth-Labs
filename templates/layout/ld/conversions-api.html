<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What is the Conversions API (CAPI)?", "acceptedAnswer": {"@type": "Answer", "text": "It is a way to send conversion events, such as leads, site visits and bookings, from your server or CRM directly to Meta and Google, instead of relying only on the pixel in the buyer's browser."}}, {"@type": "Question", "name": "Do I still need the Meta Pixel?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Meta recommends using the pixel and CAPI together. We set up deduplication with shared event IDs so each lead is counted once."}}, {"@type": "Question", "name": "Why does CAPI matter for real estate?", "acceptedAnswer": {"@type": "Answer", "text": "Your real results, calls, site visits and bookings, happen offline in your CRM and sales office. CAPI sends those back, so Meta and Google can find more buyers who actually visit, not just people who fill forms."}}, {"@type": "Question", "name": "Will it work with Meta instant lead forms?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Leads from instant forms can be synced to your CRM, and the stages your team updates (contacted, site visit, booked) are sent back to Meta to train the campaign."}}, {"@type": "Question", "name": "Is it safe and privacy-friendly?", "acceptedAnswer": {"@type": "Answer", "text": "Personal details such as phone numbers and emails are hashed (SHA-256) before they are sent, and we follow your consent settings. Your data stays in your own accounts."}}, {"@type": "Question", "name": "Does it work with Google Ads too?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. We set up enhanced conversions for leads and offline conversion imports, so Google Ads counts qualified leads and site visits, not just form submissions."}}, {"@type": "Question", "name": "How long does setup take?", "acceptedAnswer": {"@type": "Answer", "text": "Usually about 7 days for the website,
