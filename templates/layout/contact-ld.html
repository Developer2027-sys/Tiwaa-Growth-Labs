{%- from "sections/contact/_faqs.html" import topics -%}
<script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@graph": [
        {
            "@type": "ContactPage",
            "@id": "{{ abs_url('/contact#webpage') }}",
            "url": "{{ abs_url('/contact') }}",
            "name": "Contact Tiwaa Growth Labs | Real Estate Marketing Gurugram",
            "description": "Contact Tiwaa Growth Labs, a real estate marketing agency in Gurugram (Gurgaon). Call or WhatsApp {{ site.phone_display }} or visit us at Sector 49, Sohna Road.",
            "inLanguage": "en-IN",
            "isPartOf": { "@type": "WebSite", "name": "{{ site.name }}", "url": "{{ abs_url('/') }}" },
            "about": { "@id": "{{ abs_url('/#organization') }}" },
            "mainEntity": { "@id": "{{ abs_url('/#organization') }}" },
            "breadcrumb": { "@id": "{{ abs_url('/contact#breadcrumb') }}" },
            "potentialAction": [
                { "@type": "CommunicateAction", "name": "Call or WhatsApp", "target": "tel:+{{ site.phone_intl }}" },
                { "@type": "CommunicateAction", "name": "Email", "target": "mailto:{{ site.email }}" }
            ]
        },
        {
            "@type": "ProfessionalService",
            "@id": "{{ abs_url('/#organization') }}",
            "name": "{{ site.name }}",
            "url": "{{ abs_url('/') }}",
            "hasMap": "https://www.google.com/maps/search/?api=1&query=Spaze+I+Tech+Park+Sector+49+Sohna+Road+Gurugram",
            "contactPoint": [
                { "@type": "ContactPoint", "telephone": "+{{ site.phone_intl }}", "contactType": "sales", "areaServed": "IN" },
                { "@type": "ContactPoint", "email": "{{ site.email }}", "contactType": "customer support", "areaServed": "IN" }
            ]
        },
        {
            "@type": "BreadcrumbList",
            "@id": "{{ abs_url('/contact#breadcrumb') }}",
            "itemListElement": [
                { "@type": "ListItem", "position": 1, "name": "Home", "item": "{{ abs_url('/') }}" },
                { "@type": "ListItem", "position": 2, "name": "Contact", "item": "{{ abs_url('/contact') }}" }
            ]
        },
        {
            "@type": "FAQPage",
            "mainEntity": [
{% for t in topics %}{% set last_topic = loop.last %}{% for f in t[1] %}
                { "@type": "Question", "name": {{ f[0] | tojson }}, "acceptedAnswer": { "@type": "Answer", "text": {{ f[1] | tojson }} } }{% if not (last_topic and loop.last) %},{% endif %}

{% endfor %}{% endfor %}
            ]
        }
    ]
}
</script>
