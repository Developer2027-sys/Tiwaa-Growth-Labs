<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<meta name="keywords" content="{{ page.keywords }}">
<meta name="robots" content="{{ page.robots }}">
<link rel="canonical" href="{{ canonical }}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:title" content="{{ page.og_title or page.title }}">
<meta property="og:description" content="{{ page.description }}">
<meta property="og:url" content="{{ canonical }}">
<meta property="og:image" content="{{ abs_url('/assets/images/og-image.png') }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{{ site.name }} logo">
<meta name="twitter:image" content="{{ abs_url('/assets/images/og-image.png') }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#1D1D1F">
{% if favicon %}
<link rel="icon" type="image/png" href="{{ favicon }}">
<link rel="apple-touch-icon" href="{{ favicon }}">
{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap">
<link rel="stylesheet" href="{{ asset('css/main.css') }}">
{% for css in page.css %}
<link rel="stylesheet" href="{{ asset(css) }}">
{% endfor %}
<script>
/* Apply the saved light/dark choice before first paint (avoids a flash). */
try{var m=localStorage.getItem('tgl-theme');if(m)document.documentElement.setAttribute('data-mode',m);}catch(e){}
window.TGL={{ tgl_json | safe }};
</script>
<script type="application/ld+json">{{ org_json | safe }}</script>
{{ page.head_extra | safe }}
